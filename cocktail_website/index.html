  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    />
    <link rel="preconnect" href="https://www.thecocktaildb.com" crossorigin />

    <!-- Apply the saved / preferred theme before first paint (prevents a colour flash). -->
    <script>
      (function () {
        var themes = ["light", "dark", "accessible"];
        var theme = null;
        try {
          var raw = localStorage.getItem("theme");
          try { theme = JSON.parse(raw); } catch (e) { theme = raw; } // legacy: unquoted value
        } catch (e) {}
        if (themes.indexOf(theme) === -1) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Cocktail Heaven</title>
