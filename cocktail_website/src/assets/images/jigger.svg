<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Jigger">
  <defs>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0" stop-color="#8d8f94"/>
      <stop offset=".35" stop-color="#f4f4f6"/>
      <stop offset=".6" stop-color="#c9cbd0"/>
      <stop offset="1" stop-color="#6e7076"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1">
      <stop offset="0" stop-color="#9a9ca1"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#85878c"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="186" rx="44" ry="6" fill="#000" opacity=".12"/>
  <!-- top (larger) cup -->
  <path d="M58 22 L142 22 L106 96 L94 96 Z" fill="url(#steel)" stroke="#5b5d62" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="100" cy="22" rx="42" ry="7" fill="url(#rim)" stroke="#5b5d62" stroke-width="2"/>
  <!-- waist -->
  <rect x="92" y="94" width="16" height="10" rx="3" fill="url(#steel)" stroke="#5b5d62" stroke-width="2"/>
  <!-- bottom (smaller) cup -->
  <path d="M94 102 L106 102 L136 176 L64 176 Z" fill="url(#steel)" stroke="#5b5d62" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="100" cy="176" rx="36" ry="6" fill="url(#rim)" stroke="#5b5d62" stroke-width="2"/>
  <path d="M70 30 L96 88" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</svg>
